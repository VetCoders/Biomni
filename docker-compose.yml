services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biomni-portal
    restart: unless-stopped
    ports:
      - "8129:8129"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8129
    volumes:
      - biomni-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8129/api/health', timeout=5)\" >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  biomni-data:
